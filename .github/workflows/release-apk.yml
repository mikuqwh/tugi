name: Release APK

# Builds the signed debug-keystore release APKs on GitHub's runners and attaches
# them to the release for the same tag. Doing it here (instead of uploading from
# a home connection) keeps the asset upload fast and reproducible.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APKs to
        required: true
        default: v0.4.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: build + attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # One APK per ABI: the full-gpl ffmpeg is the bulk of the size, and a
      # universal build would be ~230 MB.
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-*-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          fail_on_unmatched_files: true
