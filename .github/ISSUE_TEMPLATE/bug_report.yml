name: Bug report
description: Something in Tugi does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please attach the file that reproduces it when the
        bug is about a conversion (a few frames of the GIF / a short video is
        enough) — most issues here are input-specific.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15
  - type: input
    id: version
    attributes:
      label: Tugi version
      placeholder: 0.3.0
  - type: textarea
    id: input
    attributes:
      label: Input file
      description: Format, size, and (if possible) the file itself.
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: |
        `adb logcat -s flutter` output, if the app crashed or a conversion failed.
      render: shell
