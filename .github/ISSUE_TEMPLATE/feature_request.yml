name: Feature request
description: Suggest a tool, a format or a UX improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Tugi makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working, screens or gestures included.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this must respect
      options:
        - label: Stays fully offline (no upload, no account)
          required: true
        - label: Format support must come from on-device ffmpeg capability probing
